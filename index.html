<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Nilai Karakter - Al Kautsar</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="logosmpit.png">
    
    <!-- ✅ Yang BENAR -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
    
<body class="bg-slate-50 min-h-screen font-sans pb-20">

    <div class="bg-emerald-700 text-white p-4 shadow-lg sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-users-rectangle text-2xl"></i>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Input Nilai Karakter Siswa</h1>
                    <p class="text-xs text-emerald-200">Mode Input Massal</p>
                </div>
            </div>
            <button onclick="kirimData()" id="btnSaveTop" class="hidden bg-yellow-400 hover:bg-yellow-500 text-emerald-900 font-bold py-1.5 px-4 rounded shadow-md text-sm transition">
                <i class="fa-solid fa-save mr-1"></i> Simpan Semua
            </button>
        </div>
    </div>

    <main class="max-w-4xl mx-auto p-4 space-y-4">
        
        <div class="bg-white p-4 rounded-lg shadow border border-slate-200 flex flex-col md:flex-row gap-4 items-end">
            <div class="w-full md:w-1/3">
                <label class="block text-xs font-bold text-slate-500 mb-1">Periode Laporan</label>
                <select id="periode" class="w-full bg-slate-50 border border-slate-200 rounded p-2 text-sm font-semibold text-slate-700 outline-none focus:border-emerald-500">
                    <option value="Juli 2026">Juli 2026</option>
                    <option value="Agustus 2026">Agustus 2026</option>
                    <option value="September 2026">September 2026</option>
                    <option value="Oktober 2026">Oktober 2026</option>
                    <option value="November 2026">November 2026</option>
                    <option value="Desember 2026">Desember 2026</option>
                    <option value="Januari 2027">Januari 2027</option>
                    <option value="Februari 2027">Februari 2027</option>
                    <option value="Maret 2027">Maret 2027</option>
                    <option value="April 2027">April 2027</option>
                    <option value="Mei 2027">Mei 2027</option>
                    <option value="Juni 2027">Juni 2027</option>
                </select>
            </div>
            <div class="w-full md:w-1/3">
                <label class="block text-xs font-bold text-slate-500 mb-1">Pilih Kelas</label>
                <select id="pilihKelas" class="w-full bg-slate-50 border border-slate-200 rounded p-2 text-sm font-semibold text-slate-700 outline-none focus:border-emerald-500">
                    <option value="">-- Memuat Kelas... --</option>
                </select>
            </div>
            <div class="w-full md:w-1/3">
                <button onclick="loadSiswa()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded shadow transition">
                    <i class="fa-solid fa-list-check mr-2"></i> Buka Data Siswa
                </button>
            </div>
        </div>

        <div id="areaInput" class="hidden">
            <div class="bg-white rounded-lg shadow overflow-hidden border border-slate-200">
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left text-slate-600">
                        <thead class="text-xs text-slate-700 uppercase bg-slate-100 border-b">
                            <tr>
                                <th class="px-4 py-3 w-10">No</th>
                                <th class="px-4 py-3 min-w-[150px]">Nama Siswa</th>
                                <th class="px-2 py-3 text-center w-24">Disiplin<br><span class="text-[9px] text-slate-400">1-4</span></th>
                                <th class="px-2 py-3 text-center w-24">Ibadah<br><span class="text-[9px] text-slate-400">1-4</span></th>
                                <th class="px-2 py-3 text-center w-24">Sosial<br><span class="text-[9px] text-slate-400">1-4</span></th>
                                <th class="px-4 py-3 min-w-[200px]">Catatan Singkat</th>
                            </tr>
                        </thead>
                        <tbody id="tabelSiswa">
                            </tbody>
                    </table>
                </div>
                
                <div class="p-4 bg-slate-50 border-t flex justify-between items-center text-xs text-slate-500">
                    <span id="totalSiswaInfo">0 Siswa dimuat</span>
                    <button onclick="isiOtomatis()" class="text-emerald-600 hover:underline">Isi Default "Baik" (3)</button>
                </div>
            </div>

            <button onclick="kirimData()" id="btnSaveBottom" class="w-full mt-6 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-xl shadow-lg transition active:scale-95 text-lg flex justify-center items-center gap-2">
                <i class="fa-solid fa-paper-plane"></i> KIRIM LAPORAN KELAS INI
            </button>
        </div>

        <div id="loading" class="hidden text-center py-10">
            <i class="fa-solid fa-circle-notch fa-spin text-4xl text-emerald-500"></i>
            <p class="text-slate-500 mt-2 text-sm">Mengambil data...</p>
        </div>

    </main>

    <script>
        // --- KONFIGURASI ---
        // GANTI URL INI DENGAN YANG BARU (VERSI DOPOST BANYAK DATA)
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxCE2mexwL_a5OZ9upm1WRSitrOI1FfmqbYGNT5Wjx3wcruDLRvtLPAB7CTfAYkvxJB/exec'; 

        // Saat halaman dimuat, ambil daftar kelas
document.addEventListener('DOMContentLoaded', () => {
    fetch(SCRIPT_URL + '?action=getListKelas')
        .then(r => r.json())
        .then(kelasArr => {
            let html = '<option value="">-- Pilih Kelas --</option>';
            kelasArr.forEach(k => html += `<option value="${k}">${k}</option>`);
            document.getElementById('pilihKelas').innerHTML = html;
        })
        .catch(err => {
            // ✅ Bagian baru ditambahkan di sini
            document.getElementById('pilihKelas').innerHTML = '<option value="">-- Gagal memuat --</option>';
            Swal.fire('Gagal Memuat Daftar Kelas', 'Periksa izin akses atau koneksi: ' + err.message, 'error');
        });
});

        let dataSiswaCurrent = [];

        // Fungsi Load Siswa
        function loadSiswa() {
    const kelas = document.getElementById('pilihKelas').value;
    if(!kelas) return Swal.fire('Pilih Kelas dulu!');

    document.getElementById('loading').classList.remove('hidden');
    document.getElementById('areaInput').classList.add('hidden');

    fetch(SCRIPT_URL + '?action=getSiswa&kelas=' + encodeURIComponent(kelas))
        .then(r => r.json())
        .then(data => {
            dataSiswaCurrent = data;
            renderTabel(data);
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('areaInput').classList.remove('hidden');
            document.getElementById('btnSaveTop').classList.remove('hidden');
            document.getElementById('totalSiswaInfo').innerText = data.length + " Siswa di kelas " + kelas;
        })
        .catch(err => {
            // ✅ Tambahkan blok ini
            document.getElementById('loading').classList.add('hidden');
            Swal.fire('Gagal Mengambil Data', 'Periksa koneksi atau izin akses: ' + err.message, 'error');
        });
}

        // Render Tabel
        function renderTabel(data) {
            let html = '';
            data.forEach((siswa, index) => {
                html += `
                <tr class="bg-white border-b hover:bg-slate-50 transition">
                    <td class="px-4 py-3 font-medium text-slate-500">${index + 1}</td>
                    <td class="px-4 py-3 font-semibold text-slate-800">
                        ${siswa.nama}
                        <input type="hidden" id="nisn_${index}" value="${siswa.nisn}">
                        <input type="hidden" id="nama_${index}" value="${siswa.nama}">
                    </td>
                    <td class="px-2 py-3 text-center">
                        <select id="disiplin_${index}" class="bg-slate-100 border border-slate-300 text-slate-800 text-sm rounded focus:ring-emerald-500 focus:border-emerald-500 block w-full p-1">
                            <option value="4">4</option>
                            <option value="3" selected>3</option>
                            <option value="2">2</option>
                            <option value="1">1</option>
                        </select>
                    </td>
                    <td class="px-2 py-3 text-center">
                        <select id="ibadah_${index}" class="bg-slate-100 border border-slate-300 text-slate-800 text-sm rounded focus:ring-emerald-500 focus:border-emerald-500 block w-full p-1">
                            <option value="4">4</option>
                            <option value="3" selected>3</option>
                            <option value="2">2</option>
                            <option value="1">1</option>
                        </select>
                    </td>
                    <td class="px-2 py-3 text-center">
                        <select id="sosial_${index}" class="bg-slate-100 border border-slate-300 text-slate-800 text-sm rounded focus:ring-emerald-500 focus:border-emerald-500 block w-full p-1">
                            <option value="4">4</option>
                            <option value="3" selected>3</option>
                            <option value="2">2</option>
                            <option value="1">1</option>
                        </select>
                    </td>
                    <td class="px-4 py-3">
                        <input type="text" id="catatan_${index}" placeholder="Catatan..." class="bg-slate-50 border border-slate-300 text-slate-900 text-xs rounded-lg focus:ring-emerald-500 focus:border-emerald-500 block w-full p-2">
                    </td>
                </tr>
                `;
            });
            document.getElementById('tabelSiswa').innerHTML = html;
        }

        // Fitur Isi Otomatis (Opsional)
        function isiOtomatis() {
            dataSiswaCurrent.forEach((_, i) => {
                document.getElementById(`disiplin_${i}`).value = "3";
                document.getElementById(`ibadah_${i}`).value = "3";
                document.getElementById(`sosial_${i}`).value = "3";
                document.getElementById(`catatan_${i}`).value = "Alhamdulillah Sudah Baik, pertahankan.";
            });
            Swal.fire('Reset', 'Semua nilai di-set ke default (3)', 'info');
        }

        // KIRIM DATA (LOGIKA BARU)
        function kirimData() {
            const periode = document.getElementById('periode').value;
            let laporanMassal = [];

            // Loop semua baris tabel
            dataSiswaCurrent.forEach((siswa, i) => {
                let disiplin = document.getElementById(`disiplin_${i}`).value;
                let ibadah = document.getElementById(`ibadah_${i}`).value;
                let sosial = document.getElementById(`sosial_${i}`).value;
                let catatan = document.getElementById(`catatan_${i}`).value;

                // Hanya masukkan data jika valid (misal guru sengaja kosongkan? di sini kita paksa kirim semua)
                laporanMassal.push({
                    nisn: siswa.nisn,
                    nama: siswa.nama,
                    periode: periode,
                    disiplin: disiplin,
                    ibadah: ibadah,
                    sosial: sosial,
                    catatan: catatan || "Alhamdulillah sudah baik" // Jika kosong, isi Insya Allah Sudah Baik
                });
            });

            // Konfirmasi dulu
            Swal.fire({
                title: 'Kirim Laporan?',
                text: `Anda akan mengirim nilai untuk ${laporanMassal.length} siswa.`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Ya, Kirim!',
                confirmButtonColor: '#059669'
            }).then((result) => {
                if (result.isConfirmed) {
                    executeSend(laporanMassal);
                }
            });
        }

        function executeSend(dataArray) {
            const btn = document.getElementById('btnSaveBottom');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Menyimpan...';
            btn.disabled = true;

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ data: dataArray }) // Bungkus dalam objek 'data'
            })
            .then(r => r.json())
            .then(res => {
                if(res.result === 'success') {
                    Swal.fire('Berhasil!', 'Data satu kelas berhasil disimpan.', 'success');
                    // Sembunyikan tabel biar guru pilih kelas lain
                    document.getElementById('areaInput').classList.add('hidden');
                    document.getElementById('pilihKelas').value = "";
                } else {
                    Swal.fire('Gagal', res.error, 'error');
                }
            })
            .catch(err => Swal.fire('Error', err.message, 'error'))
            .finally(() => {
                btn.innerHTML = originalText;
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
